*{margin:0;padding:0;box-sizing:border-box;}
body{background:#1a1a2e;color:#e0e0e0;font-family:"Microsoft YaHei",sans-serif;display:flex;justify-content:center;padding:20px;min-height:100vh;}
#game{display:flex;gap:20px;max-width:1200px;width:100%;}
#mainArea{flex:1;display:flex;flex-direction:column;gap:10px;}

#choices{display:flex;flex-wrap:wrap;gap:8px;min-height:50px;}
.btn{background:#2d2d44;color:#e0e0e0;border:1px solid #555;padding:10px 18px;border-radius:6px;cursor:pointer;font-size:14px;transition:all .2s;}
.btn:hover{background:#4a4a6a;border-color:#888;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn-danger{border-color:#c0392b;color:#e74c3c;}
.btn-danger:hover{background:#3d1a1a;}
#statPanel{width:280px;background:#0f0f1a;border:2px solid #444;border-radius:8px;padding:15px;font-size:13px;}
#statPanel h3{color:#ffd700;margin-bottom:10px;text-align:center;}
.stat-row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #222;}
.stat-row .label{color:#aaa;}
.stat-row .value{color:#fff;font-weight:bold;}
.equip-slots{margin-top:12px;}
.equip-slots h4{color:#aaa;margin-bottom:6px;font-size:12px;}
.slot{background:#1a1a2e;border:1px dashed #444;border-radius:4px;padding:8px;margin-bottom:6px;min-height:50px;font-size:11px;line-height:1.5;}
.slot.filled{border-style:solid;border-color:#666;}
.slot .ename{color:#ffd700;font-weight:bold;}
.slot .trait{color:#ff69b4;font-size:10px;margin-top:3px;}
.point-controls{margin-top:10px;padding-top:10px;border-top:1px solid #333;}
.point-row{display:flex;align-items:center;justify-content:space-between;padding:3px 0;font-size:12px;}
.point-row button{width:24px;height:24px;background:#2d2d44;color:#fff;border:1px solid #555;border-radius:3px;cursor:pointer;font-size:14px;line-height:1;}
.point-row button:hover{background:#4a4a6a;}
.point-row button:disabled{opacity:.3;cursor:not-allowed;}
.point-row .plabel{flex:1;color:#aaa;}
.point-row .pval{width:30px;text-align:center;color:#fff;}
.eye-info{text-align:center;color:#ffd700;font-size:12px;margin-bottom:8px;}
.elem-fire{color:#ff6b35;}
.elem-water{color:#4fc3f7;}
.elem-grass{color:#81c784;}
.elem-thunder{color:#ffd54f;}
.stat-atk{color:#ff8c00;}
.stat-hp{color:#66bb6a;}
.stat-bj{color:#ffd54f;}
.stat-bs{color:#4fc3f7;}
.stat-crt{color:#ba68c8;}
#hpBarArea{background:#0f0f1a;border:2px solid #444;border-radius:8px;padding:10px 15px;}
#hpBarArea .hp-label{font-size:13px;color:#aaa;margin-bottom:4px;}
#hpBarArea .hp-nums{font-size:18px;font-weight:bold;color:#66bb6a;margin-bottom:6px;}
#hpBarTrack{width:100%;height:18px;background:#222;border-radius:9px;overflow:hidden;}
#hpBarFill{height:100%;background:linear-gradient(90deg,#4caf50,#81c784);transition:width .3s;border-radius:9px;}
#hpBarFill.low{background:linear-gradient(90deg,#e74c3c,#ff7043);}
#shieldBarWrap{margin-top:6px;display:none;}
#shieldBarWrap .hp-label{color:#ccc;}
#shieldBarTrack{width:100%;height:12px;background:#222;border-radius:6px;overflow:hidden;}
#shieldBarFill{height:100%;background:linear-gradient(90deg,#e0e0e0,#ffffff);transition:width .3s;border-radius:6px;}
#enemyBarArea{background:#0f0f1a;border:2px solid #553333;border-radius:8px;padding:10px 15px;display:none;}
#enemyBarArea .hp-label{font-size:13px;color:#ff9999;margin-bottom:4px;}
#enemyBarArea .hp-nums{font-size:16px;font-weight:bold;color:#ff6b6b;margin-bottom:6px;}

#enemyBarFill{height:100%;background:linear-gradient(90deg,#c62828,#ef5350);transition:width .3s;border-radius:8px;}
.enemy-trait-desc{margin-top:8px;font-size:12px;color:#cc9999;line-height:1.6;}
.enemy-trait-desc .trait-item{display:inline-block;background:#2a1a2a;border:1px solid #553355;border-radius:4px;padding:2px 8px;margin:2px 4px 2px 0;}
.slot-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.slot-grid .slot:nth-child(5){grid-column:1/-1;}

.slot .estats{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px;}
.slot .estat-item{font-size:10px;}

function hasETrait(id){return enemy.traits&&enemy.traits.some(t=>t.id===id);}
function getETraitNames(){return enemy.traits&&enemy.traits.length>0?enemy.traits.map(t=>t.name).join("·"):"";}

function print(s,cls="",raw=false){
    let html;
    if(raw){html=String(s).replace(/\n/g,"<br>");}
    else{let escaped=String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");html=escaped.replace(/\n/g,"<br>");}
    if(cls){outputDom.innerHTML+=`<div class="${cls}">${html}</div>`;}
    else{outputDom.innerHTML+=`<div>${html}</div>`;}
    outputDom.scrollTop=outputDom.scrollHeight;
}

function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}

function getElemCount(){
    let count={火:0,水:0,草:0,雷:0};
    for(let s of player.slots){if(s)count[s.element]++;}
    return count;
}
function getSetBonus(){
    let c=getElemCount();
    let active=[];
    for(let e of elements){
        if(c[e]>=4)active.push(e+"4");
        else if(c[e]>=2)active.push(e+"2");
    }
    return active;
}
function hasSet(tag){return getSetBonus().indexOf(tag)>=0;}

        if(s&&s.trait){
            if(s.trait.id==="deadlyStrike")atkMult*=0.5;
            if(s.trait.id==="crit20x")atkMult*=0.7;
        }
    }
    return atkMult;
}

function hasTrait(id){
    for(let s of player.slots){if(s&&s.trait&&s.trait.id===id)return true;}
    return false;
}
function countTrait(id){
    let c=0;
    for(let s of player.slots){if(s&&s.trait&&s.trait.id===id)c++;}
    return c;
}

function getTraitProbMult(){
    if(hasSet("草4"))return 2.5;
    if(hasSet("草2"))return 1.5;
    return 1;
}

function calcBaseStats(){
    let j=jobData[player.job];
    let b=blessingData[player.blessing];
    let p=save.purchased||{egg:0,potion:0,boots:0,hat:0,doll:0};
    let atk=j.atk+b.atk+save.pointAtk*8+p.egg*10;
    let hp=j.hp+b.hp+save.pointHp*5+p.potion*100;
    let bj=j.bj+b.bj+save.pointBj*0.03+p.boots*0.05;
    let bs=j.bs+b.bs+save.pointBs*0.06+p.hat*0.10;
    let crt=j.crt+b.crt+save.pointCrt*0.025+p.doll*0.05;
    return {atk,hp,bj,bs,crt};
}

function applyEquipStats(){
    let base=calcBaseStats();
    let atk=base.atk,hp=base.hp,bj=base.bj,bs=base.bs,crt=base.crt;
    for(let s of player.slots){
        if(s){atk+=s.atk;hp+=s.hp;bj+=s.bj;bs+=s.bs;crt+=s.crt;}
    }
    atk=Math.floor(atk*getTraitMult());
    atk+=player.blessAtkAdd||0;
    atk+=player.permAtkAdd||0;
    hp+=player.blessHpAdd||0;
    hp+=player.permHpAdd||0;
    bj+=player.blessBjAdd||0;
    bs+=player.blessBsAdd||0;
    crt+=player.blessCrtAdd||0;
    player.atk=atk;player.maxHp=hp;player.hp=hp;player.bj=bj;player.bs=bs;player.crt=crt;
}

function oneSlotHtml(idx){
    let s=player.slots[idx];
    if(!s)return `<div class="slot">槽位${idx+1}：空</div>`;
    let traitHtml=s.trait?`<div class="trait">【${s.trait.name}】${s.trait.desc}</div>`:"";
    return `<div class="slot filled"><span class="ename">${s.name}</span> <span class="${elemClass(s.element)}">【${s.element}】</span>
    <div class="estats">
    <span class="estat-item stat-atk">ATK+${s.atk}</span>
    <span class="estat-item stat-hp">HP+${s.hp}</span>
    <span class="estat-item stat-bj">BJ+${Math.floor(s.bj*100)}%</span>
    <span class="estat-item stat-bs">BS+${Math.floor(s.bs*100)}%</span>
    <span class="estat-item stat-crt">CRT+${Math.floor(s.crt*100)}%</span>
    </div>${traitHtml}</div>`;
}

function refreshHpBar(){
    let hpNums=document.getElementById("hpNums");
    let hpFill=document.getElementById("hpBarFill");
    if(hpNums)hpNums.textContent=`${player.hp} / ${player.maxHp}`;
    if(hpFill){
        let pct=player.maxHp>0?Math.max(0,Math.min(100,player.hp/player.maxHp*100)):0;
        hpFill.style.width=pct+"%";
        hpFill.className=pct<30?"low":"";
    }
    let shieldWrap=document.getElementById("shieldBarWrap");
    let shieldFill=document.getElementById("shieldBarFill");
    if(shieldWrap&&shieldFill){
        if(player.ZDYHP>0){
            shieldWrap.style.display="block";
            let spct=player.maxHp>0?Math.min(100,player.ZDYHP/player.maxHp*100):0;
            shieldFill.style.width=spct+"%";
        }else{
            shieldWrap.style.display="none";
        }
    }
    let enemyArea=document.getElementById("enemyBarArea");
    let enemyLabel=document.getElementById("enemyBarLabel");
    let enemyNums=document.getElementById("enemyHpNums");

        enemyArea.style.display="block";

        enemyLabel.textContent=`【${enemy.name}】 ATK:${enemy.atk}${traitStr}`;
        enemyNums.textContent=`${Math.max(0,enemy.hp)} / ${enemy.maxHp}`;
        let epct=enemy.maxHp>0?Math.max(0,Math.min(100,enemy.hp/enemy.maxHp*100)):0;
        enemyFill.style.width=epct+"%";

function adjPoint(type,delta){
    if(!player.canAdjustPoint)return;
    let usedEye=save.pointAtk+save.pointHp+save.pointBj+save.pointBs+save.pointCrt;
    if(type==="blood"){
        if(delta>0&&save.useBlood<10&&save.blood>save.useBlood){save.useBlood++;}
        else if(delta<0&&save.useBlood>0){save.useBlood--;}
    }else{
        let key="point"+type.charAt(0).toUpperCase()+type.slice(1);
        if(delta>0&&usedEye<save.eyeTotal){save[key]++;}
        else if(delta<0&&save[key]>0){save[key]--;}
    }
    writeSave();
    if(player.job){applyEquipStats();}
    refreshStatPanel();
}

function genEquip(wave){
    if(wave===undefined)wave=player.wave;
    let name=pick(lootAdj)+pick(lootNoun);
    let element=pick(elements);
    let scale=1+Math.min(1,wave/20)*1.0;
    let atk=Math.floor(rand(5,25)*scale),hp=Math.floor(rand(10,80)*scale),bj=rand(0,8)/100,bs=rand(0,10)/100,crt=rand(0,6)/100;
    bj=Math.floor(bj*scale*100)/100;bs=Math.floor(bs*scale*100)/100;crt=Math.floor(crt*scale*100)/100;
    let trait=null;
    let traitProb=0.15+Math.min(1,wave/20)*0.15;
    if(Math.random()<traitProb){
        trait=pick(traitList);
        if(trait.id==="shieldGain"){trait={...trait,value:pick([1000,800,500])};}
    }
    return {name,element,atk,hp,bj,bs,crt,trait};
}

function afterEquip(){
    pendingLoot=null;
    lastEquipAction=null;
    player.hp=player.maxHp;
    let sg=countTrait("shieldGain");
    if(sg>0){
        let totalShield=0;
        for(let s of player.slots){if(s&&s.trait&&s.trait.id==="shieldGain")totalShield+=s.trait.value;}
        player.ZDYHP=Math.max(player.ZDYHP,totalShield);
        print(`【护盾之核】获得${totalShield}点生命护盾！`);
    }
    refreshStatPanel();
    if(gameState==="loot"){nextWave();}
    else if(gameState==="bossLoot"){enterBoss();}
}

function genEnemy(isBoss,bossType){
    let diffMult=Math.pow(1.4,save.useBlood);
    if(isBoss){
        if(bossType==="魔王"){
            enemy={name:"魔王",atk:Math.floor(2000*diffMult),hp:Math.floor(200000*diffMult),maxHp:Math.floor(200000*diffMult),traits:[],shield:0,dots:[],firstStrikeUsed:false};
        }else{
            enemy={name:"它",atk:Math.floor(3000*diffMult),hp:Math.floor(300000*diffMult),maxHp:Math.floor(300000*diffMult),traits:[],shield:0,dots:[],firstStrikeUsed:false};
        }
        return;
    }
    let wave=player.wave;
    let baseAtk=Math.floor((50+wave*15)*(0.5+Math.random()*1.0));
    let baseHp=Math.floor((300+wave*80)*(0.5+Math.random()*1.0));
    if(wave>=7){
        if(player.job==="战士")baseHp=Math.floor(baseHp*rand(4,6));
        else if(player.job==="勇者")baseHp=Math.floor(baseHp*rand(3,5));
    }
    let eTraits=[];
    let eTraitProb=0.15+Math.min(1,wave/20)*0.15;
    if(save.useBlood>=6)eTraitProb*=1.5;
    let maxTraits=save.useBlood>=4?3:1;
    let tried={};
    for(let t=0;t<maxTraits;t++){
        if(Math.random()<eTraitProb){
            let candidates=enemyTraitList.filter(x=>!tried[x.id]);
            if(candidates.length>0){
                let picked=candidates[Math.floor(Math.random()*candidates.length)];
                tried[picked.id]=true;
                eTraits.push(picked);
            }
        }
    }
    if(save.useBlood>=8&&eTraits.length===0){
        let picked=enemyTraitList[Math.floor(Math.random()*enemyTraitList.length)];
        eTraits.push(picked);
    }
    let eShield=0;
    if(eTraits.some(t=>t.id==="shield")){eShield=Math.floor((300+wave*80)*0.20*diffMult);}
    let eAtk=Math.floor(baseAtk*diffMult);
    if(eTraits.some(t=>t.id==="trueSight")){eAtk=Math.floor(eAtk*0.70);}
    enemy={name:pick(monsterAdj)+pick(monsterNoun),atk:eAtk,hp:Math.floor(baseHp*diffMult),maxHp:Math.floor(baseHp*diffMult),traits:eTraits,shield:eShield,dots:[],firstStrikeUsed:false};
    if(eTraits.length>0){for(let et of eTraits){print(`【敌人特性】这只敌人拥有【${et.name}】：${et.desc}`);}}
    if(save.useBlood>=9&&Math.random()<0.30){
        let filled=[];
        for(let i=0;i<player.slots.length;i++){if(player.slots[i])filled.push(i);}
        if(filled.length>0){
            let ridx=filled[Math.floor(Math.random()*filled.length)];
            let lost=player.slots[ridx];
            player.slots[ridx]=null;
            applyEquipStats();
            print(`【难度${save.useBlood}】黑暗的力量侵蚀了你，你失去了一件装备：`);
            showEquip(lost);
        }
    }
}

function applyDots(){
    if(!enemy.dots||enemy.dots.length===0)return;
    let totalDot=0;
    let newDots=[];
    for(let d of enemy.dots){
        let dmg=0;
        if(d.type==="burn"){dmg=Math.floor(player.atk*0.20*d.stacks);}
        else if(d.type==="poison"){dmg=Math.floor(enemy.maxHp*0.03*d.stacks);}
        else if(d.type==="bleed"){dmg=Math.floor(enemy.hp*0.05*d.stacks);}
        totalDot+=dmg;
        d.turns--;
        if(d.turns>0)newDots.push(d);
    }
    enemy.dots=newDots;
    if(totalDot>0){
        if(enemy.shield>0){
            if(enemy.shield>=totalDot){enemy.shield-=totalDot;print(`敌人护盾吸收了${totalDot}点持续伤害，剩余护盾${enemy.shield}`);totalDot=0;}
            else{totalDot-=enemy.shield;print(`敌人护盾吸收了${enemy.shield}点持续伤害`);enemy.shield=0;}
        }
        if(totalDot>0){enemy.hp-=totalDot;print(`【持续伤害】敌人受到${totalDot}点持续伤害！`);}
    }
}
function addDot(type,name){
    if(!enemy.dots)enemy.dots=[];
    let existing=enemy.dots.find(d=>d.type===type);
    if(existing){existing.stacks=Math.min(5,existing.stacks+1);existing.turns=3;}
    else{enemy.dots.push({type,name,stacks:1,turns:3});}
    print(`【${name}】敌人陷入了${name}状态！`);
}

        print(`【战狂】敌人因连击损失${selfDmg}点生命值！`);
    }
    if(hasETrait("thief")&&Math.random()<0.25){
        let filled=[];
        for(let i=0;i<player.slots.length;i++){if(player.slots[i])filled.push(i);}
        if(filled.length>0){
            let ridx=filled[Math.floor(Math.random()*filled.length)];
            let stolen=player.slots[ridx];
            player.slots[ridx]=null;
            applyEquipStats();
            print(`【小偷】敌人偷走了你的装备：`);
            showEquip(stolen);
        }
    }
    if(player.hp<=0){
        let pmult=getTraitProbMult();
        let ro=countTrait("reviveOnce");
        if(ro>0&&player.ZBSPECIALUSED1<ro){
            player.hp=player.maxHp;player.ZBSPECIALUSED1++;
            print(`【不死意志】你满血复活了！（剩余${ro-player.ZBSPECIALUSED1}次）`);
        }else{
            let r30=countTrait("revive30");
            if(r30>0&&Math.random()<0.30*r30*pmult){
                player.hp=1;
                print("【苟延残喘】你保留了1点生命！");
            }
        }
    }
    refreshStatPanel();
}

function doAttackRound(){
    if(autoBattle&&player.energy>=100){
        burstAttack();
    }else{
        playerAttack();
    }
    if(enemy.hp<=0){onEnemyDefeat();return;}
    applyDots();
    if(enemy.hp<=0){onEnemyDefeat();return;}
    enemyAttack();
    if(player.hp<=0){onPlayerDefeat();return;}
    if(autoBattle){setTimeout(battleLoop,300);}
    else{battleLoop();}
}
function simulateBossSkip(){
    print("\n=== 快速模拟最终决战 ===");
    let avgDmg=player.atk;
    avgDmg=avgDmg*(1+Math.min(1,player.bj)*(player.bs-1));
    if(hasSet("火4"))avgDmg*=1.25;else if(hasSet("火2"))avgDmg*=1.10;
    let thunderDot=0;
    if(hasSet("雷4"))thunderDot=enemy.maxHp*0.06;else if(hasSet("雷2"))thunderDot=enemy.maxHp*0.03;
    avgDmg+=thunderDot;
    let burstEvery=100/15;
    avgDmg+=(player.atk*5)/burstEvery;
    if(player.job==="天使"){avgDmg*=(1+Math.floor(player.maxHp/100)*0.01);}
    if(player.job==="隐士"&&player.crt>1){avgDmg*=(1+Math.floor((player.crt-1)*100/5)*0.02);}
    if(player.blessing==="天使的祝福"){avgDmg*=(1+(player.hp/player.maxHp)*0.3);}
    if(player.blessing==="隐士的祝福"&&player.crt>1){avgDmg*=(1+(player.crt-1));}
    let bossDmg=enemy.atk;
    let effCrt=Math.min(0.95,player.crt);
    if(enemy.name==="魔王"){effCrt=effCrt*0.95+effCrt*0.5*0.05;}
    bossDmg*=(1-effCrt);
    if(hasSet("水4"))bossDmg*=0.80;else if(hasSet("水2"))bossDmg*=0.92;
    let iw=countTrait("ironWall");
    if(iw>0)bossDmg*=Math.max(0.1,1-0.15*iw);
    let healPerTurn=0;
    if(player.job==="战士")healPerTurn+=avgDmg*0.20;
    if(player.blessing==="战士的祝福")healPerTurn+=player.maxHp*0.03;
    let ah=countTrait("attackHeal");
    if(ah>0)healPerTurn+=player.maxHp*0.03*ah;
    let ls=countTrait("lifesteal");
    if(ls>0)healPerTurn+=avgDmg*0.10*ls;
    let ch=countTrait("critHeal");
    if(ch>0)healPerTurn+=player.maxHp*0.10*ch*Math.min(1,player.bj);
    let totalHp=player.maxHp+(player.ZDYHP||0);
    let turnsToKill=enemy.maxHp/avgDmg;
    let netLoss=Math.max(0,bossDmg-healPerTurn);
    let turnsSurvive=netLoss>0?totalHp/netLoss:9999;
    print(`玩家每回合平均伤害：${Math.floor(avgDmg)}`);
    print(`BOSS每回合平均伤害：${Math.floor(bossDmg)}`);
    print(`玩家每回合平均回血：${Math.floor(healPerTurn)}`);
    print(`击杀BOSS需约 ${turnsToKill.toFixed(1)} 回合`);
    print(`玩家约能撑 ${turnsSurvive.toFixed(1)} 回合`);
    if(turnsToKill<=turnsSurvive){
        print("模拟结果：你成功击败了BOSS！");
        enemy.hp=0;
        onEnemyDefeat();
    }else{
        print("模拟结果：你力竭倒下了……");
        player.hp=0;
        onPlayerDefeat();
    }
}
function battleLoop(){
    if(enemy.hp<=0){onEnemyDefeat();return;}
    if(player.hp<=0){onPlayerDefeat();return;}
    clearChoices();
    print(`\n【${enemy.name}】 ATK:${enemy.atk} HP: ${Math.max(0,enemy.hp)}/${enemy.maxHp} | 能量: ${player.energy}/100`);
    if(autoBattle){
        addChoice("停止自动战斗",()=>{autoBattle=false;print("已停止自动战斗。");battleLoop();},"btn-danger");
        setTimeout(doAttackRound,300);
        return;
    }
    addChoice("攻击",()=>doAttackRound());
    addChoice("防御",()=>{print("你选择防御，伤害减少90%，积蓄能量，下次攻击伤害+50%");player.energy=Math.min(100,player.energy+25);player.nextDefendBoost=true;let origAtk=enemy.atk;enemy.atk=Math.floor(origAtk*0.1);enemyAttack();enemy.atk=origAtk;if(player.hp<=0){onPlayerDefeat();return;}battleLoop();});
    if(player.energy>=100){
        addChoice("必杀技",()=>{burstAttack();if(enemy.hp<=0){onEnemyDefeat();return;}applyDots();if(enemy.hp<=0){onEnemyDefeat();return;}enemyAttack();if(player.hp<=0){onPlayerDefeat();return;}battleLoop();});
    }
    addChoice("自动战斗",()=>{autoBattle=true;print("自动战斗开启，将持续攻击直到战斗结束。");battleLoop();});
    if(gameState==="bossBattle"){
        addChoice("一键跳过最终决战",()=>{simulateBossSkip();},"btn-danger");
    }
    addChoice("逃跑",()=>{if(Math.random()<0.3){print("你成功逃跑了！");gameState="badEnd";badEnd(1);}else{print("逃跑失败！");enemyAttack();if(player.hp<=0){onPlayerDefeat();return;}battleLoop();}});
}

function onEnemyDefeat(){
    if(hasETrait("explode")){
        let explodeDmg=Math.floor(player.maxHp*0.10);
        if(player.ZDYHP>0){
            if(player.ZDYHP>=explodeDmg){player.ZDYHP-=explodeDmg;print(`【爆裂】敌人死亡时爆炸！护盾吸收了${explodeDmg}点伤害，剩余护盾${player.ZDYHP}`);explodeDmg=0;}
            else{explodeDmg-=player.ZDYHP;print(`【爆裂】敌人死亡时爆炸！护盾吸收了${player.ZDYHP}点伤害`);player.ZDYHP=0;}
        }
        if(explodeDmg>0){player.hp-=explodeDmg;print(`【爆裂】敌人死亡时爆炸，你受到${explodeDmg}点伤害！`);}
    }
    print(`你击败了 【${enemy.name}】！`);
    let kh=countTrait("killHeal");
    if(kh>0){
        let heal=Math.floor(player.maxHp*0.30*kh);
        player.hp=Math.min(player.maxHp,player.hp+heal);
        print(`【斩杀回复】回复${heal}点生命！`);
    }
    if(gameState==="bossBattle"){
        let gold=rand(100,200);
        save.gold=(save.gold||0)+gold;
        print(`你获得了 ${gold} 枚金币！当前：${save.gold}`);
        writeSave();
    }else{
        let gold=rand(10,20);
        save.gold=(save.gold||0)+gold;
        print(`你获得了 ${gold} 枚金币！当前：${save.gold}`);
        writeSave();
    }
    if(hasSet("火4")){
        let bonus=Math.floor(player.atk*0.10);
        player.atk+=bonus;
        print(`【火焰四件】攻击力永久提升${bonus}点！`);
    }else if(hasSet("火2")){
        let bonus=Math.floor(player.atk*0.04);
        player.atk+=bonus;
        print(`【火焰两件】攻击力永久提升${bonus}点！`);
    }
    if(hasSet("水4")){
        let bonus=Math.floor(player.maxHp*0.10);
        player.maxHp+=bonus;player.hp+=bonus;
        print(`【流水四件】血量上限永久提升${bonus}点！`);
    }else if(hasSet("水2")){
        let bonus=Math.floor(player.maxHp*0.04);
        player.maxHp+=bonus;player.hp+=bonus;
        print(`【流水两件】血量上限永久提升${bonus}点！`);
    }
    if(player.blessing==="战士的祝福"){
        let bonus=Math.floor(player.atk*0.05);
        player.blessAtkAdd+=bonus;player.atk+=bonus;
        print(`【战士的祝福】攻击力提升${bonus}点！`);
    }
    if(player.blessing==="天使的祝福"){
        let bonus=Math.floor(player.maxHp*0.05);
        player.blessHpAdd+=bonus;player.maxHp+=bonus;player.hp+=bonus;
        print(`【天使的祝福】血量上限提升${bonus}点！`);
    }
    if(player.blessing==="勇者的祝福"){
        player.blessBjAdd+=0.03;player.blessBsAdd+=0.05;
        player.bj+=0.03;player.bs+=0.05;
        print(`【勇者的祝福】暴击率+3%，暴击伤害+5%！`);
    }
    if(player.blessing==="隐士的祝福"){
        player.blessCrtAdd+=0.03;player.crt+=0.03;
        print(`【隐士的祝福】闪避率+3%！`);
    }
    if(player.job==="战士"){
        let bonus=Math.floor(player.atk*0.03);
        player.permAtkAdd+=bonus;player.atk+=bonus;
        print(`【战士】攻击力额外提升${bonus}点！`);
    }
    if(player.job==="天使"){
        let bonus=Math.floor(player.maxHp*0.03);
        player.permHpAdd+=bonus;player.maxHp+=bonus;player.hp+=bonus;
        print(`【天使】血量上限额外提升${bonus}点！`);
    }
    if(player.job==="隐士"){
        player.crt+=0.02;
        print(`【隐士】闪避率+2%！`);
    }
    let atkGain=Math.floor(player.atk*0.02);
    let hpGain=Math.floor(player.maxHp*0.02);
    player.permAtkAdd+=atkGain;
    player.permHpAdd+=hpGain;
    player.atk+=atkGain;
    player.maxHp+=hpGain;
    player.hp+=hpGain;
    print(`战胜之力：攻击力+${atkGain}，血量上限+${hpGain}（永久）`);
    refreshStatPanel();
    if(gameState==="bossBattle"){
        if(enemy.name==="魔王"){trueEnd1();}
        else{trueEnd2();}
        return;
    }
    gameState="loot";
    let e1=genEquip();
    let e2=genEquip();
    showLootChoice(e1,e2,"loot");
}

function onPlayerDefeat(){
    print("你被击败了...");
    gameState="badEnd";
    badEnd(2);
}

function nextWave(){
    player.wave++;
    if(player.wave>20){
        gameState="bossLoot";
        let lose=1;
        print(`\n魔王出现了！它的威压震落了你的1件装备！`);
        let filled=[];
        for(let i=0;i<player.slots.length;i++){if(player.slots[i])filled.push(i);}
        for(let i=filled.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[filled[i],filled[j]]=[filled[j],filled[i]];}
        let dropCount=Math.min(lose,filled.length);
        for(let i=0;i<dropCount;i++){
            let ridx=filled[i];
            let dropped=player.slots[ridx];
            print(`你的装备被震落了：`);
            showEquip(dropped);
            player.slots[ridx]=null;
        }
        applyEquipStats();
        refreshStatPanel();
        let e1=genEquip();
        let e2=genEquip();
        showLootChoice(e1,e2,"bossLoot");
        return;
    }
    print(`\n=== 第 ${player.wave} 波 ===`);
    genEnemy(false);
    print(`遭遇了 【${enemy.name}】！ATK:${enemy.atk} HP:${enemy.hp}`);
    gameState="battle";
    battleLoop();
}

function enterBoss(){
    gameState="bossBattle";
    if(player.Q3>=3){
        print("\n……你就是不肯听话，是不是？");
        print("空间扭曲了，真正的恐怖降临了……");
        genEnemy(true,"它");
        print("\n【魔王的加护】魔王的力量涌入你的体内！");
        player.atk=Math.floor(player.atk*5);
        player.maxHp=Math.floor(player.maxHp*5);
        player.hp=player.maxHp;
        player.bj=player.bj*2;
        player.bs=player.bs*2;
        player.crt=player.crt*3;
        print(`当前属性：ATK ${player.atk} | HP ${player.maxHp} | 暴击 ${Math.floor(player.bj*100)}% | 爆伤 ${Math.floor(player.bs*100)}% | 闪避 ${Math.floor(player.crt*100)}%`);
    }else{
        print("\n魔王站在你面前！");
        genEnemy(true,"魔王");
    }
    print(`【${enemy.name}】 ATK:${enemy.atk} HP:${enemy.hp}`);
    clearChoices();
    addChoice("迎战魔王",()=>battleLoop());
    if(player.Q3<3){
        addChoice("拒绝迎战",()=>{
            player.Q3++;
            if(player.Q3>=3){
                print("……你就是不肯听话，是不是？");
                gameState="bossBattle";
                setTimeout(()=>{enterBoss();},500);
            }else{
                print("请专注战斗。");
                enterBoss();
            }
        },"btn-danger");
    }
}

function badEnd(type){
    clearChoices();
    let msgs={
        1:"【Bad End 1】你逃离了战场，传说就此终结。",
        2:"【Bad End 2】你倒在了血泊中，再也没有醒来。",
        3:"【Bad End 3】你被魔王的力量吞噬，成为了它的傀儡。",
        4:"【Bad End 4】你在恐惧中放弃了，世界陷入黑暗。",
        5:"【Bad End 5】你的装备全部损毁，手无寸铁的你无法继续。",
        6:"【Bad End 6】你迷失在了无尽的战斗中，忘记了回家的路。"
    };
    print(msgs[type]||"【Bad End】故事结束了。");
    addChoice("重新开始",()=>location.reload());
}

function trueEnd1(){
    clearChoices();
    print("\n【True End 1 - 浴血之剑】");
    print("你击败了魔王！世界恢复了和平。");
    print("你的传说将被永远传颂。");
    save.eyeTotal=Math.min(24,save.eyeTotal+2);
    print(`你获得了 2 枚魔王之眼！当前：${save.eyeTotal}/24`);
    writeSave();
    refreshStatPanel();
    addChoice("重新开始",()=>location.reload());
}

function trueEnd2(){
    clearChoices();
    print("\n【True End 2 - 回家】");
    print("你击败了它！那不可名状的存在消散了。");
    print("你找到了回家的路。");
    save.blood++;
    print(`你获得了 1 颗它之血珠！当前：${save.blood}`);
    save.eyeTotal=Math.min(24,save.eyeTotal+1);
    print(`你获得了 1 枚魔王之眼！当前：${save.eyeTotal}/24`);
    writeSave();
    refreshStatPanel();
    addChoice("重新开始",()=>location.reload());
}

let bannedJob=null,bannedBless=null;
function startGame(){
    gameState="start";
    outputDom.innerHTML="";
    print("欢迎来到卡桑德里传说6.5");
    print("在这片被黑暗笼罩的大陆上，你将踏上讨伐魔王的旅程。");
    bannedJob=null;bannedBless=null;
    if(save.useBlood>=3){
        let jobs=Object.keys(jobData);
        bannedJob=jobs[Math.floor(Math.random()*jobs.length)];
        let blesses=Object.keys(blessingData);
        bannedBless=blesses[Math.floor(Math.random()*blesses.length)];
        print(`\n【难度${save.useBlood}】黑暗的诅咒笼罩了一切！`);
        print(`职业【${bannedJob}】被禁止选择！`);
        print(`祝福【${bannedBless}】被禁止选择！`);
    }
    print("\n请选择你的职业：");
    clearChoices();
    for(let j in jobData){
        if(j===bannedJob){addChoice(`【已禁用】${j} - ${jobData[j].desc}`,()=>{print("该职业已被黑暗诅咒封印，无法选择。");});}
        else{addChoice(`${j} - ${jobData[j].desc}`,()=>selectJob(j));}
    }
}

function selectJob(j){
    player.job=j;
    print(`你选择了 ${j}`);
    print("\n请选择你的祝福：");
    clearChoices();
    for(let b in blessingData){
        if(b===bannedBless){addChoice(`【已禁用】${b} - ${blessingData[b].desc}`,()=>{print("该祝福已被黑暗诅咒封印，无法选择。");});}
        else{addChoice(`${b} - ${blessingData[b].desc}`,()=>selectBlessing(b));}
    }
}

function selectBlessing(b){
    player.blessing=b;
    player.blessAtkAdd=0;player.blessHpAdd=0;player.blessBjAdd=0;player.blessBsAdd=0;player.blessCrtAdd=0;
    player.permAtkAdd=0;player.permHpAdd=0;
    player.energy=0;player.nextDefendBoost=false;player.ZBSPECIALUSED1=0;player.ZDYHP=0;
    autoBattle=false;
    initSlots();
    print(`你获得了 ${b}`);
    applyEquipStats();
    if(player.blessing==="勇者的祝福"&&player.bj>1){
        let shield=Math.floor((player.bj-1.0)*0.4*100);
        player.ZDYHP=shield;
        print(`【勇者的祝福】暴击溢出转化为 ${shield} 点战斗护盾！`);
    }
    refreshStatPanel();
    print("\n准备好开始冒险了吗？");
    clearChoices();
    addChoice("极速版（直接开战）",()=>{player.canAdjustPoint=false;refreshStatPanel();player.wave=0;nextWave();});
    addChoice("普通版（查看教程）",()=>{player.canAdjustPoint=false;refreshStatPanel();showTutorial();});
}

function showTutorial(){
    print("\n=== 游戏教程 ===");
    print("1. 每波战斗你可以选择攻击、防御或逃跑。");
    print("2. 击败敌人有概率获得装备，装备可以提升属性。");
    print("3. 装备有火/水/草/雷四种属性，2件同属性小幅加成，4件大幅加成。");
    print("4. 部分装备带有特殊特性，效果强大。");
    print("5. 击败20波小怪后将面对魔王。");
    print("6. 魔王之眼可永久强化初始属性，它之血珠可提升难度。");
    print("7. 右侧面板可在开局时分配点数，进入战斗后锁定。");
    clearChoices();
    addChoice("开始冒险",()=>{player.wave=0;nextWave();});
}

refreshStatPanel();
startGame();
</script>
