<!DOCTYPE html>
<meta charset="utf-8">
<title>卡桑德里传说 5.0（数值平衡扩充版）</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'%3E%3Crect width='8' height='8' fill='%230a0c0a'/%3E%3Crect x='3' y='1' width='2' height='1' fill='%2339ff8f'/%3E%3Crect x='2' y='2' width='4' height='1' fill='%2339ff8f'/%3E%3Crect x='1' y='3' width='6' height='2' fill='%2339ff8f'/%3E%3Crect x='2' y='5' width='1' height='1' fill='%2339ff8f'/%3E%3Crect x='5' y='5' width='1' height='1' fill='%2339ff8f'/%3E%3Crect x='1' y='6' width='1' height='1' fill='%23ffb454'/%3E%3Crect x='6' y='6' width='1' height='1' fill='%23ffb454'/%3E%3C/svg%3E">
<style>
@font-face{
  font-family:'FusionPixel';
  src:url('fonts/fusion-pixel-12px-proportional-zh_hans.otf.woff2') format('woff2');
  font-display:swap;
  font-weight:normal;
  font-style:normal;
}
:root{
  --bg:#0a0c0a;
  --panel:#10140f;
  --panel2:#161c14;
  --border:#3a4a34;
  --border-lit:#5c7a52;
  --text:#c8e6c0;
  --dim:#5f7a58;
  --accent:#ffb454;
  --accent2:#39ff8f;
  --danger:#ff4d4d;
  --good:#39ff8f;
  --crit:#ffe066;
  --bg-deep:#050605;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'FusionPixel','Cascadia Mono','Consolas','Noto Sans Mono CJK SC','Microsoft YaHei',monospace,sans-serif;
  image-rendering:pixelated;
}
#app{display:flex;flex-direction:column;height:100vh;position:relative;}
/* CRT 扫描线覆层：可开关 */
#app.crt-on::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:50;
  background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px);
  mix-blend-mode:multiply;opacity:.55;
}
header{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:8px 12px;border-bottom:3px solid var(--border);background:var(--panel);
  flex-wrap:wrap;
  box-shadow:0 3px 0 var(--bg-deep);
  position:relative;z-index:101;
  outline:2px solid var(--border-lit);outline-offset:-6px;
}
header h1{font-size:16px;margin:0;letter-spacing:1px;color:var(--accent2);font-weight:400;text-shadow:2px 2px 0 var(--bg-deep);}
header .sub{font-size:12px;color:var(--dim);margin-left:8px;}
.toggle{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim);}
.toggle input{accent-color:var(--accent2);image-rendering:pixelated;width:14px;height:14px;}
#layout{display:flex;flex:1;min-height:0;}
#terminal-wrap{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;position:relative;border-right:3px solid var(--border);outline:2px solid var(--border-lit);outline-offset:-6px;}
#term-titlebar{
  display:flex;align-items:center;gap:8px;padding:4px 10px;background:var(--panel2);
  border-bottom:2px solid var(--border);font-size:12px;color:var(--dim);letter-spacing:1px;flex-shrink:0;
}
#term-titlebar .dots{display:flex;gap:5px;}
#term-titlebar .dot{width:8px;height:8px;background:var(--border-lit);}
#turnProgress{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap;max-width:55%;justify-content:flex-end;}
.turn-dot{width:6px;height:6px;background:var(--border);flex-shrink:0;}
.turn-dot.done{background:var(--accent2);}
.turn-dot.cur{background:var(--accent);}
#terminal{
  flex:1;overflow-y:auto;padding:16px 18px 8px 18px;min-height:0;
  line-height:1.7;font-size:14px;cursor:pointer;
  scrollbar-color:var(--border-lit) var(--bg-deep);scrollbar-width:auto;
}
#terminal::-webkit-scrollbar{width:14px;}
#terminal::-webkit-scrollbar-track{background:var(--bg-deep);}
#terminal::-webkit-scrollbar-thumb{background:var(--border-lit);border:3px solid var(--bg-deep);}
#terminal .line{white-space:pre-line;margin:0 0 8px 0;word-break:break-word;}
#terminal .line.block{
  border-left:4px solid var(--border-lit);padding:6px 10px;margin:6px 0 12px 0;
  background:var(--panel2);color:var(--accent);
}
#terminal .line.preview{
  border-left:4px dashed var(--border);padding:4px 10px;margin:-4px 0 12px 0;
  background:transparent;font-size:12.5px;color:var(--dim);
}
#terminal .line.dim{color:var(--dim);font-style:italic;}
#terminal .line.hl{color:var(--accent2);}
#terminal .line.crit{color:var(--crit);}
#terminal .line.bad{color:var(--danger);}
#terminal .line.good{color:var(--good);}
#terminal .line.end{color:var(--accent);font-weight:400;font-size:16px;margin-top:10px;}
.delta-up{color:var(--good);}
.delta-down{color:var(--danger);}
.delta-same{color:var(--dim);}
#scrollLatestBtn{
  position:absolute;right:16px;bottom:10px;background:var(--panel2);color:var(--accent2);
  border:2px solid var(--border-lit);padding:6px 12px;font-family:inherit;font-size:12px;cursor:pointer;
  box-shadow:3px 3px 0 var(--bg-deep);
}
#scrollLatestBtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--bg-deep);}
#choices{
  display:flex;flex-wrap:wrap;gap:8px;padding:10px 18px 14px 18px;border-top:3px solid var(--border);
  background:var(--panel);min-height:52px;align-items:center;
}
.choice-btn{
  background:var(--panel2);color:var(--text);border:2px solid var(--border-lit);
  padding:8px 14px;cursor:pointer;font-family:inherit;font-size:13px;
  box-shadow:3px 3px 0 var(--bg-deep);
}
.choice-btn:hover{background:#1e2a1a;color:var(--accent2);}
.choice-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--bg-deep);background:var(--accent2);color:var(--bg-deep);}
#hud{
  width:288px;flex-shrink:0;background:var(--panel);
  padding:12px;overflow-y:auto;
  scrollbar-color:var(--border-lit) var(--bg-deep);
}
#hud h2{font-size:12px;color:var(--dim);letter-spacing:2px;margin:0 0 8px 0;text-transform:uppercase;}
.war-badge{
  display:inline-block;background:var(--panel2);border:2px solid var(--border-lit);
  padding:1px 8px;font-size:12px;color:var(--accent2);
}
.hpbar{position:relative;height:14px;border:2px solid var(--border-lit);background:var(--bg-deep);overflow:visible;margin:4px 0 2px 0;}
.hpbar .fill{height:100%;background:var(--good);transition:width .2s steps(8);position:relative;}
.hpbar .fill.warn{background:var(--accent);}
.hpbar .fill.danger{background:var(--danger);}
.hpbar .fill.overflow{background:var(--crit);box-shadow:inset 0 0 0 2px var(--bg-deep);}
.hpbar::after{content:'';position:absolute;inset:0;pointer-events:none;
  background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.35) 0 2px,transparent 2px 8px);}
.hp-text{font-size:11px;color:var(--dim);text-align:right;margin-bottom:6px;}
.hp-text.overflow,#hudm-hptext.overflow{color:var(--crit);}
@keyframes flashUp{0%,100%{color:var(--text);}40%{color:var(--good);}}
@keyframes flashDown{0%,100%{color:var(--text);}40%{color:var(--danger);}}
.flash-up{animation:flashUp .5s steps(4);}
.flash-down{animation:flashDown .5s steps(4);}
.stat-row{display:flex;justify-content:space-between;padding:4px 0;font-size:13px;border-bottom:1px solid var(--border);}
.stat-row-hp{display:block;}
.stat-row .k{color:var(--dim);}
.stat-row .v{color:var(--text);font-weight:400;}
@keyframes dmgFloat{0%{opacity:1;transform:translateY(0);}100%{opacity:0;transform:translateY(-18px);}}
.dmg-float{
  position:absolute;top:-4px;right:2px;font-size:12px;font-weight:400;pointer-events:none;
  animation:dmgFloat .8s steps(6) forwards;z-index:5;
}
.dmg-float.dmg{color:var(--danger);}
.dmg-float.crit{color:var(--crit);font-size:15px;}
.dmg-float.heal{color:var(--good);}
.dmg-float.dodge{color:var(--accent2);}
.enemy-card{margin:0 0 14px 0;border:2px solid var(--border-lit);background:var(--panel2);padding:8px 10px;}
.enemy-card[hidden]{display:none;}
.enemy-name{color:var(--danger);font-size:13px;margin-bottom:4px;}
.enemy-atk-line{font-size:11px;color:var(--dim);margin-bottom:2px;}
.equip-slots{margin-top:10px;display:flex;flex-direction:column;gap:8px;}
.slot{
  border:2px dashed var(--border);padding:7px 9px;min-height:44px;font-size:11.5px;
}
.slot.filled{border-style:solid;border-color:var(--accent);background:var(--panel2);}
.slot-name{color:var(--accent);font-weight:400;margin-bottom:3px;}
.slot-empty{color:var(--dim);}
.slot-stats{color:var(--dim);line-height:1.5;}
#equipDetails summary{font-size:12px;color:var(--dim);letter-spacing:2px;margin:16px 0 8px 0;text-transform:uppercase;cursor:pointer;list-style:none;}
#equipDetails summary::-webkit-details-marker{display:none;}
.icon-btn{
  background:var(--panel2);color:var(--accent2);border:2px solid var(--border-lit);
  width:32px;height:32px;font-size:16px;cursor:pointer;box-shadow:3px 3px 0 var(--bg-deep);
}
.icon-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--bg-deep);}
.choice-btn.danger{border-color:var(--danger);color:var(--danger);}
.choice-btn.danger:hover{background:#3a1414;color:var(--danger);}
.choice-btn.danger:active{background:var(--danger);color:var(--bg-deep);}
.overlay{
  position:fixed;inset:0;background:rgba(4,6,4,.82);z-index:100;
  display:flex;align-items:center;justify-content:center;padding:16px;
}
.overlay[hidden]{display:none;}
.overlay.confirm{z-index:200;}
.overlay-panel{
  background:var(--panel);border:3px solid var(--border-lit);box-shadow:6px 6px 0 var(--bg-deep);
  max-width:520px;width:100%;max-height:86vh;overflow-y:auto;padding:20px 22px;
}
.overlay-panel h2{color:var(--accent2);font-size:16px;margin:0 0 14px 0;letter-spacing:1px;font-weight:400;}
.overlay-panel h3{color:var(--dim);font-size:12px;margin:16px 0 8px 0;letter-spacing:2px;text-transform:uppercase;font-weight:400;}
.overlay-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}
.overlay-row:last-child{border-bottom:none;}
.overlay-actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap;}
.overlay-actions[hidden]{display:none;}
.title-title{font-size:22px;color:var(--accent2);text-shadow:3px 3px 0 var(--bg-deep);margin:0 0 4px 0;letter-spacing:2px;}
.title-ver{color:var(--dim);font-size:12px;margin:0 0 22px 0;letter-spacing:1px;}
.title-menu{display:flex;flex-direction:column;gap:10px;}
.title-menu .choice-btn{width:100%;text-align:left;}
.title-menu .choice-btn:disabled{opacity:.4;cursor:not-allowed;}
.title-menu .choice-btn:disabled:hover{background:var(--panel2);color:var(--text);}
.save-slot{border:2px solid var(--border-lit);background:var(--panel2);padding:8px 10px;margin-bottom:8px;}
.save-slot .meta{font-size:11.5px;color:var(--dim);margin-bottom:6px;line-height:1.6;}
.save-slot .meta b{color:var(--accent);font-weight:400;}
.save-slot .empty{font-size:12px;color:var(--dim);padding:6px 0;}
.save-slot .ops{display:flex;gap:6px;flex-wrap:wrap;}
.save-slot .ops .choice-btn{padding:5px 10px;font-size:12px;}
.changelog-list{margin:0;padding-left:18px;font-size:13px;line-height:1.9;color:var(--text);}
.changelog-list li::marker{color:var(--accent2);}
.settings-field{padding:10px 0;border-bottom:1px solid var(--border);}
.settings-field .label{font-size:12px;color:var(--dim);letter-spacing:1px;margin-bottom:8px;}
.radio-row{display:flex;gap:14px;}
.radio-row label{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;}
.radio-row input{accent-color:var(--accent2);}
@media (max-width:820px){
  #layout{flex-direction:column;}
  #hud{
    width:100%;border-top:3px solid var(--border);order:1;max-height:none;
    display:flex;flex-direction:column;gap:0;padding:8px 10px;
  }
  #hud h2{display:none;}
  #hud .war-badge{display:none;}
  #hud>.stat-row{display:none;}
  #hudMobileBar{display:flex;gap:10px;align-items:center;font-size:11px;flex-wrap:wrap;}
  #hudMobileBar .hpbar{flex:1 1 100px;min-width:80px;margin:0;}
  #hudMobileBar b{color:var(--accent2);font-weight:400;}
  .equip-slots{margin-top:6px;}
  #equipDetails{width:100%;}
  #equipDetails summary{cursor:pointer;color:var(--dim);font-size:12px;list-style:none;padding:4px 0;}
  #equipDetails summary::-webkit-details-marker{display:none;}
  #equipDetails summary::before{content:'▸ ';}
  #equipDetails[open] summary::before{content:'▾ ';}
  .enemy-card{margin:6px 0 0 0;}
  #terminal-wrap{order:2;}
  header h1{font-size:14px;}
}
@media (min-width:821px){
  #hudMobileBar{display:none;}
}
</style>

<div id="app" class="crt-on">
  <header>
    <div><h1>卡桑德里传说</h1><span class="sub">静态网页版 · 5.0</span></div>
    <div style="display:flex;gap:10px;">
      <button id="settingsBtn" class="icon-btn" title="设置">⚙</button>
    </div>
  </header>
  <div id="layout">
    <div id="terminal-wrap">
      <div id="term-titlebar">
        <span class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>
        <span>TERMINAL // 卡桑德里传说</span>
        <div id="turnProgress"></div>
      </div>
      <div id="terminal"></div>

        <div class="hpbar" id="hud-hpbar"><div class="fill" id="hud-hpfill"></div></div>

      <div class="stat-row"><span class="k">BJ 暴击率</span><span class="v" id="hud-bj">5 %</span></div>

          <div class="slot" id="slot1"><div class="slot-empty">空槽位 1</div></div>

        </div>
      </details>
    </aside>
  </div>

  <div id="welcomeOverlay" class="overlay">
    <div class="overlay-panel">
      <div class="title-title">卡桑德里传说</div>
      <div class="title-ver">5.0（数值平衡扩充版） · 静态网页版</div>
      <div class="title-menu">
        <button class="choice-btn" id="btnNewGame">新的征途</button>
        <button class="choice-btn" id="btnContinue">继续</button>
        <button class="choice-btn" id="btnSaveMenu">存档</button>
        <button class="choice-btn" id="btnSettingsMenu">设置</button>
        <button class="choice-btn" id="btnChangelog">更新内容</button>
      </div>
    </div>
  </div>

  <div id="settingsOverlay" class="overlay" hidden>
    <div class="overlay-panel">
      <h2>设置</h2>
      <div class="settings-field">
        <div class="label">文字速度</div>
        <div class="radio-row">
          <label><input type="radio" name="speedOpt" value="normal"> 普通</label>
          <label><input type="radio" name="speedOpt" value="fast"> 极速</label>
        </div>
      </div>
      <div class="settings-field">
        <label class="toggle"><input type="checkbox" id="skipAnimToggle"> 跳过打字动画</label>
      </div>
      <div class="settings-field">
        <label class="toggle"><input type="checkbox" id="crtToggle" checked> CRT 扫描线</label>
      </div>
      <div class="overlay-actions">
        <button class="choice-btn" id="btnReplayTutorial">重看教程</button>
      </div>
      <div class="overlay-actions" id="settingsGameActions" hidden>
        <button class="choice-btn" id="btnSettingsSave">保存到槽位</button>
        <button class="choice-btn danger" id="btnReturnTitle">返回标题</button>
      </div>
      <div class="overlay-actions">
        <button class="choice-btn" id="btnSettingsClose">关闭</button>
      </div>
    </div>
  </div>

  <div id="saveOverlay" class="overlay" hidden>
    <div class="overlay-panel">
      <h2>存档</h2>
      <div id="saveSlotList"></div>
      <div class="overlay-actions">
        <button class="choice-btn" id="btnSaveClose">关闭</button>
      </div>
    </div>
  </div>

  <div id="changelogOverlay" class="overlay" hidden>
    <div class="overlay-panel">
      <h2>更新内容 · 5.0</h2>
      <h3>5.0 数值平衡与词表扩充</h3>
      <ol class="changelog-list" id="changelogV5"></ol>
      <h3>4.0 玩法变更</h3>
      <ol class="changelog-list" id="changelogPlay"></ol>
      <h3>网页版特性</h3>
      <ol class="changelog-list" id="changelogWeb"></ol>
      <div class="overlay-actions">
        <button class="choice-btn" id="btnChangelogClose">关闭</button>
      </div>
    </div>
  </div>

  <div id="confirmOverlay" class="overlay confirm" hidden>
    <div class="overlay-panel" style="max-width:380px;">
      <h2 id="confirmTitle">确认</h2>
      <div class="overlay-row" id="confirmMsg" style="border-bottom:none;font-size:13px;line-height:1.7;"></div>
      <div class="overlay-actions">
        <button class="choice-btn danger" id="confirmOk">确认</button>
        <button class="choice-btn" id="confirmCancel">取消</button>
      </div>
    </div>
  </div>
</div>

<script>
'use strict';

/* ---------- 数据表（照抄原表） ---------- */

/* ---------- 随机数 ---------- */
function randint(a,b){ return a+Math.floor(Math.random()*(b-a+1)); }
function uniform(a,b){ return a+Math.random()*(b-a); }
function chance(p){ return Math.random()<=p; }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function pyRange(a,b){ const r=[]; for(let i=a;i<b;i++) r.push(i); return r; }
function weightedInt(specs){
  let pool=[],weights=[];
  for (const [a,b,w] of specs){
    const r=pyRange(a,b);
    pool=pool.concat(r);
    for (let i=0;i<r.length;i++) weights.push(w);
  }
  const total=weights.reduce((s,w)=>s+w,0);
  let r=Math.random()*total;
  for (let i=0;i<pool.length;i++){ if (r<weights[i]) return pool[i]; r-=weights[i]; }
  return pool[pool.length-1];
}
/* 装备权重函数：区间与权重逐一照抄原代码 */
function atkWeight(){ return weightedInt([[0,21,200],[21,41,3],[41,61,2],[61,81,1],[81,100,1],[-20,0,5]]); }

function bjWeight(){ return weightedInt([[-20,-9,10],[-9,0,20],[0,11,200],[11,50,5]])/100; }
function bsWeight(){ return weightedInt([[-30,-9,5],[-9,0,10],[0,21,200],[21,60,10]])/100; }
function crtWeight(){ return weightedInt([[-5,0,10],[0,1,50],[0,11,80],[11,31,5],[31,40,2]])/100; }

function fmtDelta(cur,next,isPercent){
  const c=isPercent?Math.trunc(cur*100):cur;
  const n=isPercent?Math.trunc(next*100):next;
  const cls=n>c?'delta-up':(n<c?'delta-down':'delta-same');
  const suf=isPercent?' %':'';
  return `${c}${suf} → <span class="${cls}">${n}${suf}</span>`;
}

}

/* 伤害/回血飘字，纯展示 */
function spawnFloatNumber(containerEl,text,cls){
  if (!containerEl || containerEl.offsetParent===null) return;
  const span=document.createElement('span');
  span.className='dmg-float '+(cls||'');
  span.textContent=text;
  containerEl.appendChild(span);
  const remove=()=>{ if (span.isConnected) span.remove(); };
  span.addEventListener('animationend',remove);
  setTimeout(remove,900);
}
/* 数值飘字格式化：绝对值小于1时保留一位小数，避免显示为0 */
function fmtFloatDelta(delta){
  const sign=delta>0?'+':'';
  return Math.abs(delta)<1 ? sign+delta.toFixed(1) : sign+Math.round(delta);
}
function flashEl(el,dir){
  if (!el) return;
  el.classList.remove('flash-up','flash-down');
  void el.offsetWidth;
  el.classList.add(dir>0?'flash-up':'flash-down');
}

function sleep(seconds){
  const ms=Math.max(0,seconds*1000);
  return new Promise(res=>{
    if (ms<=0){ res(); return; }
    let done=false;
    const t=setTimeout(()=>{ if(!done){done=true; fastForward=null; res();} },ms);
    fastForward=()=>{ if(!done){done=true; clearTimeout(t); res();} };
  });
}

function typeLine(text,cls){
  const el=document.createElement('div');
  el.className='line'+(cls?(' '+cls):'');
  termEl.appendChild(el);
  trimTerminal();
  scrollBottom();
  const charDelay = skipAnim ? 0 : (G.fast ? 7 : 18);
  if (charDelay===0){ el.textContent=text; scrollBottom(); return Promise.resolve(); }
  let i=0,done=false;
  return new Promise(res=>{
    fastForward=()=>{ if(!done){done=true; el.textContent=text; scrollBottom(); res();} };
    const iv=setInterval(()=>{
      if (done) return;
      i++;
      el.textContent=text.slice(0,i);
      /* 每 4 字或收尾才触发滚动的 reflow，长文本打字时降低卡顿 */
      if (i%4===0 || i>=text.length) scrollBottom();
      if (i>=text.length){ done=true; clearInterval(iv); fastForward=null; res(); }
    },charDelay);
  });
}

/* L: 打印一行/一段文字，随后停顿 pauseSec 秒（对应 print + time.sleep） */
async function L(text,pauseSec,cls){
  const block = text.indexOf('\n')>=0;
  await typeLine(text, cls || (block?'block':''));
  if (pauseSec>0) await sleep(pauseSec);
}

function choose(options){

      btn.textContent=opt.label;
      btn.onclick=()=>{ choicesEl.innerHTML=''; resolve(opt.value); };
      choicesEl.appendChild(btn);
    });
  });
}

function hpBarClass(cur,max){
  if (max<=0) return 'danger';

let prevHUD={ATK:null,ZDYHP:null,BJ:null,BS:null,CRT:null};
function updateHUD(){
  const atkEl=document.getElementById('hud-atk'), bjEl=document.getElementById('hud-bj'),
        bsEl=document.getElementById('hud-bs'), crtEl=document.getElementById('hud-crt');
  const mAtk=document.getElementById('hudm-atk'), mBj=document.getElementById('hudm-bj'),
        mBs=document.getElementById('hudm-bs'), mCrt=document.getElementById('hudm-crt'),
        mHpText=document.getElementById('hudm-hptext'), mHpFill=document.getElementById('hudm-hpfill');
  if (prevHUD.ATK!==null && G.ATK!==prevHUD.ATK){ flashEl(atkEl,G.ATK-prevHUD.ATK); flashEl(mAtk,G.ATK-prevHUD.ATK); }
  if (prevHUD.BJ!==null && G.BJ!==prevHUD.BJ){ flashEl(bjEl,G.BJ-prevHUD.BJ); flashEl(mBj,G.BJ-prevHUD.BJ); }
  if (prevHUD.BS!==null && G.BS!==prevHUD.BS){ flashEl(bsEl,G.BS-prevHUD.BS); flashEl(mBs,G.BS-prevHUD.BS); }
  if (prevHUD.CRT!==null && G.CRT!==prevHUD.CRT){ flashEl(crtEl,G.CRT-prevHUD.CRT); flashEl(mCrt,G.CRT-prevHUD.CRT); }
  atkEl.textContent=G.ATK;
  bjEl.textContent=Math.trunc(G.BJ*100)+' %';
  bsEl.textContent=Math.trunc(G.BS*100)+' %';
  crtEl.textContent=Math.trunc(G.CRT*100)+' %';
  /* 非战斗态（装备/结算界面）按 G.HP 满血渲染，避免与已过期的 G.ZDYHP 比较产生假溢出/假残血 */
  const dispCur = G.combat ? G.ZDYHP : G.HP;
  const hpTextEl=document.getElementById('hud-hp');
  const overflowAmt=dispCur>G.HP ? Math.trunc(dispCur-G.HP) : 0;
  hpTextEl.textContent=`${Math.trunc(dispCur)} / ${G.HP}`+(overflowAmt>0?` (+${overflowAmt})`:'');
  hpTextEl.classList.toggle('overflow',overflowAmt>0);
  document.getElementById('hud-war').textContent = G.WAR>0 ? Math.min(G.WAR,20) : '-';

  const hpFill=document.getElementById('hud-hpfill');
  const hpPct=G.HP<=0 ? 0 : Math.max(0,Math.min(100,dispCur/G.HP*100));
  hpFill.style.width=hpPct+'%';
  hpFill.className='fill '+hpBarClass(dispCur,G.HP);
  if (prevHUD.ZDYHP!==null && G.ZDYHP!==prevHUD.ZDYHP){
    const delta=G.ZDYHP-prevHUD.ZDYHP;
    const dtxt=fmtFloatDelta(delta), dcls=delta>0?'heal':'dmg';
    flashEl(hpTextEl,delta);
    flashEl(mHpText,delta);
    spawnFloatNumber(document.getElementById('hud-hpbar'), dtxt, dcls);
    spawnFloatNumber(document.getElementById('hudm-hpbar'), dtxt, dcls);
  }

  mAtk.textContent=G.ATK; mBj.textContent=Math.trunc(G.BJ*100)+'%'; mBs.textContent=Math.trunc(G.BS*100)+'%';
  mCrt.textContent=Math.trunc(G.CRT*100)+'%';
  mHpText.textContent=`${Math.trunc(dispCur)}/${G.HP}`+(overflowAmt>0?` (+${overflowAmt})`:'');
  mHpText.classList.toggle('overflow',overflowAmt>0);
  mHpFill.style.width=hpPct+'%';
  mHpFill.className='fill '+hpBarClass(dispCur,G.HP);

  prevHUD={ATK:G.ATK,ZDYHP:G.ZDYHP,BJ:G.BJ,BS:G.BS,CRT:G.CRT};

  for (let i=1;i<=3;i++){
    const el=document.getElementById('slot'+i);
    const s=G['slot'+i];
    if (G['ZB'+i]===1 && s){
      el.classList.add('filled');
      const sg=v=>(v<0?'':'+')+v;
      el.innerHTML='';
      const nameDiv=document.createElement('div');
      nameDiv.className='slot-name'; nameDiv.textContent=s.name;
      const statDiv=document.createElement('div');
      statDiv.className='slot-stats';
      statDiv.textContent=`ATK${sg(s.atk)} HP${sg(s.hp)} BJ${sg(Math.trunc(s.bj*100))}% BS${sg(Math.trunc(s.bs*100))}% CRT${sg(Math.trunc(s.crt*100))}%`;
      el.appendChild(nameDiv); el.appendChild(statDiv);
    } else {
      el.classList.remove('filled');
      el.innerHTML=`<div class="slot-empty">空槽位 ${i}</div>`;
    }
  }

  const tp=document.getElementById('turnProgress');
  tp.innerHTML='';
  const curWar=Math.min(Math.max(G.WAR,0),20);
  for (let i=1;i<=20;i++){
    const d=document.createElement('span');
    d.className='turn-dot'+(i<=curWar?' done':'')+(i===curWar?' cur':'');
    tp.appendChild(d);
  }

  const filledCount=[1,2,3].filter(i=>G['ZB'+i]===1).length;
  document.getElementById('equipDetails').querySelector('summary').textContent=`装备 ${filledCount}/3`;
}

/* ---------- 战斗交锋（玩家先手，含"死后反击"保留行为） ---------- */
async function combatTurn(ep,ctx){
  if (aborted(ep)) return;
  const hpPhrase = ctx.hpPhrase || '的血量还剩';
  const isCrit=chance(G.BJ);
  let damage;
  if (isCrit){
    damage=critDamage();
    ctx.setHP(ctx.getHP()-damage);
    if (ctx.enemyMaxHP) updateEnemyCard(ctx.getHP(),ctx.enemyMaxHP);
    spawnFloatNumber(document.getElementById('enemyHpBar'),'-'+damage,'crit');
    await L(`暴击了！你造成了 ${damage} 点伤害，${ctx.nameDisplay}${hpPhrase} ${ctx.getHP()} 点！`,ctx.pauseSec,'crit');
  } else {
    damage=normalDamage();
    ctx.setHP(ctx.getHP()-damage);
    if (ctx.enemyMaxHP) updateEnemyCard(ctx.getHP(),ctx.enemyMaxHP);
    spawnFloatNumber(document.getElementById('enemyHpBar'),'-'+damage,'dmg');
    await L(`你造成了 ${damage} 点伤害，${ctx.nameDisplay}${hpPhrase} ${ctx.getHP()} 点！`,ctx.pauseSec);
  }
  if (aborted(ep)) return;
  if (G.warrior){
    G.ZDYHP += damage*WARRIOR_BLOODSUCK;
    await L(`你触发了回血效果，血量暂时回复至 ${Math.trunc(G.ZDYHP)} 点。`,ctx.pauseSec,'good');
    if (aborted(ep)) return;
  }
  const dodged=chance(G.CRT);
  if (dodged){
    spawnFloatNumber(document.getElementById('hud-hpbar'),'闪避','dodge');
    await L(`你闪避了${ctx.nameDisplay}对你造成的伤害,血量还剩下 ${Math.trunc(G.ZDYHP)} 点。`,ctx.pauseSec,'hl');
    if (aborted(ep)) return;
    if (ctx.crtDecay){
      const dec=uniform(0.08,0.12);
      G.CRT-=dec;
      await L(`糟糕！“它”的能力使你失去了 ${Math.trunc(dec*100)} %的闪避率！`,ctx.pauseSec,'bad');
      if (aborted(ep)) return;
      await L(`你还剩下 ${Math.trunc(G.CRT*100)} %的闪避率。`,ctx.pauseSec);
      if (aborted(ep)) return;
    }
  } else {
    const harm=ctx.enemyAtk+randint(ctx.dmgMin,ctx.dmgMax);
    G.ZDYHP-=harm;
    await L(`${ctx.nameDisplay}对你造成了 ${harm} 点伤害，你的血量还剩 ${Math.trunc(G.ZDYHP)} 点。`,ctx.pauseSec,'bad');
    if (aborted(ep)) return;
    if (ctx.crtDecay){
      const dec=uniform(0.03,0.08);
      G.CRT-=dec;
      await L(`糟糕！“它”的伤害使你失去了 ${Math.trunc(dec*100)} %的闪避率！`,ctx.pauseSec,'bad');
      if (aborted(ep)) return;
      await L(`你还剩下 ${Math.trunc(G.CRT*100)} %的闪避率。`,ctx.pauseSec);
      if (aborted(ep)) return;
    }
  }
  if (aborted(ep)) return;
  updateHUD();
}

/* ---------- 装备生成与穿戴流程 ---------- */
function generateEquip(){
  return { atk:atkWeight(), hp:hpWeight(), bj:bjWeight(), bs:bsWeight(), crt:crtWeight() };
}
function equipBlockText(idx,name,item){
  const prefix = idx==null ? '' : `槽位${idx}：`;
  return `${prefix}${name}\nATK: + ${item.atk}\nHP: + ${item.hp}\nBJ： + ${Math.trunc(item.bj*100)} %\nBS： + ${Math.trunc(item.bs*100)} %\nCRT： + ${Math.trunc(item.crt*100)} %`;
}

/* 装备默认按序自动入槽：有空槽自动装入编号最小的空槽；三槽全满才进入替换选择 */
async function equipSlotFlow(ep,name,item){
  if (aborted(ep)) return;
  const tm=timeMap();
  const emptyIdx=[1,2,3].find(i=>G['ZB'+i]===0);
  if (emptyIdx){
    G['ZB'+emptyIdx]=1;
    G['slot'+emptyIdx]={...item,name};
    G.ATK+=item.atk; G.HP+=item.hp; G.BJ+=item.bj; G.BS+=item.bs; G.CRT+=item.crt;
    updateHUD();
    await L(`已装入槽位 ${emptyIdx}。装备成功！请查看你现在的面板。`,tm.t0);
    if (aborted(ep)) return;
    await L(panelText(),tm.t0);
    if (aborted(ep)) return;
    await continuePrompt();
    return;
  }
  await L('三个槽位都已装满，先看看现在的装备……',tm.t0);
  if (aborted(ep)) return;
  for (let i=1;i<=3;i++){
    const s=G['slot'+i];
    await L(equipBlockText(i,s.name,s),TIME_SHORT);
    if (aborted(ep)) return;
    appendHTMLBlock(replacePreviewHTML(s,item));
  }
  await L('要替换哪个槽位上的装备？放弃则新装备丢失。',0);
  if (aborted(ep)) return;
  const a5=await choose([
    {label:'1 替换槽位1',value:1},{label:'2 替换槽位2',value:2},{label:'3 替换槽位3',value:3},{label:'4 放弃',value:4}
  ]);
  if (aborted(ep)) return;
  if (a5===4) return; // 放弃，新装备丢失
  const idx=a5;
  const old=G['slot'+idx];
  G.ATK-=old.atk; G.HP-=old.hp; G.BJ-=old.bj; G.BS-=old.bs; G.CRT-=old.crt;
  G['slot'+idx]={...item,name};
  G.ATK+=item.atk; G.HP+=item.hp; G.BJ+=item.bj; G.BS+=item.bs; G.CRT+=item.crt;
  updateHUD();
  await L('装备成功！请查看你现在的面板。',tm.t0);
  if (aborted(ep)) return;
  await L(panelText(),tm.t0);
  if (aborted(ep)) return;
  await continuePrompt();
}

async function equipDropFlow(ep){
  if (aborted(ep)) return;
  const tm=timeMap();
  await L('让我看看它身上藏着什么好东西……',uniform(tm.t1,tm.t2));
  if (aborted(ep)) return;
  const name1=pick(ZBXRC)+pick(ZBZL);

  await L('再看看它们的面板……',tm.t0);
  if (aborted(ep)) return;
  const hasEmpty=[1,2,3].some(i=>G['ZB'+i]===0);
  await L(`1.${name1}\nATK: + ${item1.atk}\nHP: + ${item1.hp}\nBJ： + ${Math.trunc(item1.bj*100)} %\nBS： + ${Math.trunc(item1.bs*100)} %\nCRT： + ${Math.trunc(item1.crt*100)} %`,tm.t0);
  if (hasEmpty) appendHTMLBlock(equipPreviewHTML(item1));
  else appendHTMLBlock(fullSlotsPreviewHTML(item1));
  if (aborted(ep)) return;
  await L(`2.${name2}\nATK: + ${item2.atk}\nHP: + ${item2.hp}\nBJ： + ${Math.trunc(item2.bj*100)} %\nBS： + ${Math.trunc(item2.bs*100)} %\nCRT： + ${Math.trunc(item2.crt*100)} %`,0);
  if (hasEmpty) appendHTMLBlock(equipPreviewHTML(item2));
  else appendHTMLBlock(fullSlotsPreviewHTML(item2));
  await L(`要装备${name1}还是装备${name2}，又或者是不装备呢？`,0);

  const a4=await choose([

  if (a4===1) await equipSlotFlow(ep,name1,item1);
  else if (a4===2) await equipSlotFlow(ep,name2,item2);
}

/* ---------- 主线：前19回合 ---------- */
async function winRound(ep,DRM){
  if (aborted(ep)) return;
  const tm=timeMap();
  G.ATK += G.ATKZJ;
  if (G.warrior){
    G.ATK = Math.floor(G.ATK*1.22);
    await L('触发了战士的祝福！',tm.t0);
    if (aborted(ep)) return;
  }
  if (G.angel){
    G.HP = Math.floor(G.HP*1.24);
    await L('触发了天使的祝福！',tm.t0);
    if (aborted(ep)) return;
  }
  if (G.hero){
    G.BJ += uniform(0.05,0.11);
    G.BS *= 1.28;
    await L(`触发了勇者的祝福！暴击率提升至 ${Math.trunc(G.BJ*100)} %，暴击伤害提升至 ${Math.trunc(G.BS*100)} %！`,tm.t0);
    if (aborted(ep)) return;
  }
  if (G.hermit){
    G.CRT += uniform(0.04,0.07);
    await L(`触发了隐士的祝福！闪避率提升至 ${Math.trunc(G.CRT*100)} %！`,tm.t0);
    if (aborted(ep)) return;
  }
  G.HP += G.HPZJ;
  G.ZDYHP = G.HP;
  updateHUD();
  await L(`你战胜了【${DRM}】！你的攻击力提升至 ${G.ATK} ,血量回复并提升至 ${G.ZDYHP} 。`,tm.t0,'good');
  if (aborted(ep)) return;

  G.DRATKXX += G.low1; G.DRATKSX += G.high1;
  G.DRHPXX += G.low2; G.DRHPSX += G.high2;
  G.ATKZJ += 2; G.HPZJ += 2;
  if (G.WAR>=10){ G.low1+=20; G.high1+=40; G.low2+=180; G.high2+=300; }

  await equipDropFlow(ep);
}

async function mainRounds(ep){
  while (!aborted(ep) && G.WAR<20){
    const tm=timeMap();
    G.ZDYHP=G.HP;
    updateHUD();
    captureRoundStart();
    const DRM=pick(DRXRC)+pick(DRZL);

    await L(`现在是第 ${G.WAR} 回合`,tm.t0);
    if (aborted(ep)) return;
    await L('正在行进中……',uniform(tm.t1,tm.t2),'dim');
    if (aborted(ep)) return;
    await L(`遇到了敌人【${DRM}】！`,tm.t0);
    if (aborted(ep)) return;
    await L(`正在分析【${DRM}】的面板……`,uniform(tm.t1,tm.t2),'dim');
    if (aborted(ep)) return;

    const baseAtk=randint(G.DRATKXX,G.DRATKSX);
    const baseHp=randint(G.DRHPXX,G.DRHPSX);
    let DRATK=Math.floor(baseAtk*(0.65+Math.random()*0.70));
    let DRHP=Math.floor(baseHp*(0.65+Math.random()*0.70));
    if (G.WAR>=7 && G.warrior) DRHP *= randint(4,6);
    if (G.WAR>=7 && G.hero) DRHP *= randint(3,5);

    await L(`【${DRM}】的攻击力为 ${DRATK} ，血量为 ${DRHP} 。`,tm.t0);
    if (aborted(ep)) return;
    await L('现在，开始战斗！',tm.t0);
    if (aborted(ep)) return;

    if (G.angel){
      const dap=angelPower();
      await L(`天使的祝福生效了！你获得了 ${Math.trunc(dap*100)} %的增伤！`,tm.t0);
      if (aborted(ep)) return;
    }
    if (G.hermit && G.CRT>1){
      const dap=hermitPower();
      await L(`隐者的祝福生效了！你获得了 ${Math.trunc(dap*100)} %的增伤！`,tm.t0);
      if (aborted(ep)) return;
    }

    const nameDisplay=`【${DRM}】`;
    const DRHPMax=DRHP;
    showEnemyCard(DRM,DRHP,DRHPMax,DRATK);
    G.combat=true;
    while (!aborted(ep) && G.ZDYHP>0 && DRHP>0){
      await combatTurn(ep,{
        nameDisplay, getHP:()=>DRHP, setHP:v=>{DRHP=v;}, enemyMaxHP:DRHPMax,
        enemyAtk:DRATK, dmgMin:-3, dmgMax:3, pauseSec:tm.t0, crtDecay:false
      });
    }
    G.combat=false;
    if (aborted(ep)) return;
    hideEnemyCard();

    if (DRHP<=0 && G.ZDYHP>0){
      await winRound(ep,DRM);
    } else if (DRHP<=0 && G.ZDYHP<=0){
      await L(`你和【${DRM}】同归于尽了。`,tm.t0,'bad');
      if (aborted(ep)) return;
      return endGame(ep,'Bad End 2:同归于尽');
    } else {
      await L(`你被【${DRM}】打死了。`,tm.t0,'bad');
      await L('（轻叹）看来，是时候寻找下一位勇者了……',tm.t0);
      if (aborted(ep)) return;
      return endGame(ep,'Bad End 3:宿命');
    }
    if (aborted(ep)) return;
    G.WAR += 1;
  }
  if (aborted(ep)) return;
  return bossNode(ep);
}

async function bossNode(ep){

  G.WAR=20;
  captureRoundStart();

  await L('你终于来到了魔王的面前。',tm.t0);

  if (occupied.length===0){
    await L('不好！魔王的威压袭来，但你身上并没有能被夺走的装备。',TIME_LAST);
  } else {
    const idx=occupied[randint(0,occupied.length-1)];
    const s=G['slot'+idx];
    G.ATK-=s.atk; G.HP-=s.hp; G.BJ-=s.bj; G.BS-=s.bs; G.CRT-=s.crt;
    G['ZB'+idx]=0; G['slot'+idx]=null;

    await L(`不好！魔王的威压让你浑身颤抖，导致你的“【${s.name}】掉在了地上！”`,TIME_LAST,'bad');
  }
  if (aborted(ep)) return;
  await L('这是你现在的面板。',TIME_LAST);
  await L(panelText(),TIME_LAST);
  if (aborted(ep)) return;
  await L('事已至此，只能继续战斗了……',TIME_LAST);
  if (aborted(ep)) return;

  let refuseCount=0;
  while (!aborted(ep)){
    const sel=await choose([
      {label:'迎战魔王',value:1},
      {label:'拒绝迎战',value:0,danger:true}
    ]);
    if (aborted(ep)) return;
    if (sel===1) break;
    refuseCount++;

/* ---------- 结局与重开 ---------- */
async function endGame(ep,label){
  if (aborted(ep)) return;
  if (label) await L(label,0,'end');
  await sleep(1);
  if (aborted(ep)) return;
  gameActive=false;
  choicesEl.innerHTML='';
  const btn=document.createElement('button');
  btn.className='choice-btn';
  btn.textContent='重新开始';
  btn.onclick=()=>{ choicesEl.innerHTML=''; startNewGame(); };
  choicesEl.appendChild(btn);
  const btn2=document.createElement('button');
  btn2.className='choice-btn';
  btn2.textContent='返回标题';
  btn2.onclick=()=>{ choicesEl.innerHTML=''; showWelcome(); };
  choicesEl.appendChild(btn2);
}

/* 偏好键：速度/动画/CRT，跨版本沿用同一命名空间（键名与旧版本一致，老用户偏好不丢）；
   存档快照键与教程状态键：随数值版本升级，与存档同前缀，避免旧档跨版本污染 */
const PREF_PREFIX='csdl4:';
const SAVE_PREFIX='csdl5:';
function prefKey(name){ return PREF_PREFIX+name; }
function saveKey(slot){ return SAVE_PREFIX+'save:'+slot; }
function speedKey(){ return prefKey('speed'); }
function tutorialKey(){ return SAVE_PREFIX+'tutorialSeen'; }
function loadSpeedPref(){ try{ return localStorage.getItem(speedKey()); }catch(e){ return null; } }
function saveSpeedPref(v){ try{ localStorage.setItem(speedKey(),v); }catch(e){} }
function loadTutorialPref(){ try{ return localStorage.getItem(tutorialKey()); }catch(e){ return null; } }
function saveTutorialPref(v){ try{ localStorage.setItem(tutorialKey(),v); }catch(e){} }
/* 统一设置 G.fast + 偏好存储 + 设置面板单选框，三处调用点保持同步 */
function applySpeed(v){
  G.fast=(v==='fast');
  saveSpeedPref(v);
  const r=document.querySelector(`input[name="speedOpt"][value="${v}"]`);
  if (r) r.checked=true;
}

function snapshotState(){
  return {
    ATK:G.ATK, ATKZJ:G.ATKZJ, HP:G.HP, HPZJ:G.HPZJ,
    BJ:G.BJ, BS:G.BS, CRT:G.CRT,
    ZB1:G.ZB1, ZB2:G.ZB2, ZB3:G.ZB3,
    slot1:G.slot1, slot2:G.slot2, slot3:G.slot3,
    WAR:G.WAR,
    DRATKXX:G.DRATKXX, DRATKSX:G.DRATKSX, DRHPXX:G.DRHPXX, DRHPSX:G.DRHPSX,
    low1:G.low1, high1:G.high1, low2:G.low2, high2:G.high2,
    warrior:G.warrior, angel:G.angel, hero:G.hero, hermit:G.hermit,
    fast:G.fast,
    savedAt:Date.now(),
  };
}
function writeSave(slot,data){ try{ localStorage.setItem(saveKey(slot),JSON.stringify(data)); }catch(e){} }
/* parse失败/字段缺失一律按空槽处理，不抛错 */
const SAVE_REQUIRED_NUM=['ATK','ATKZJ','HP','HPZJ','BJ','BS','CRT','ZB1','ZB2','ZB3','WAR',
  'DRATKXX','DRATKSX','DRHPXX','DRHPSX','low1','high1','low2','high2','savedAt'];
const SAVE_REQUIRED_BOOL=['warrior','angel','hero','hermit','fast'];
function readSave(slot){
  try{
    const raw=localStorage.getItem(saveKey(slot));
    if (!raw) return null;
    const d=JSON.parse(raw);
    if (!d || typeof d!=='object') return null;
    for (const k of SAVE_REQUIRED_NUM) if (!Number.isFinite(d[k])) return null;
    for (const k of SAVE_REQUIRED_BOOL) if (typeof d[k]!=='boolean') return null;
    if (!Number.isInteger(d.WAR) || d.WAR<0 || d.WAR>20) return null;
    for (let i=1;i<=3;i++){
      const s=d['slot'+i];
      if (d['ZB'+i]===1){
        if (!s || typeof s.name!=='string' || s.name.length>40 ||
            !Number.isFinite(s.atk) || !Number.isFinite(s.hp) ||
            !Number.isFinite(s.bj) || !Number.isFinite(s.bs) || !Number.isFinite(s.crt)) return null;
      } else if (s!==null){
        return null;
      }
    }
    return d;
  } catch(e){ return null; }
}
function deleteSave(slot){ try{ localStorage.removeItem(saveKey(slot)); }catch(e){} }
/* 一次性清理 4.0 时代的旧版存档（版本号已升级，数值不兼容，避免残留占用） */
function cleanupLegacySaves(){
  try{
    const legacyPrefix='csdl4:save:';
    const toRemove=[];
    for (let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if (k && k.startsWith(legacyPrefix)) toRemove.push(k);
    }
    toRemove.forEach(k=>localStorage.removeItem(k));
  }catch(e){}
}

let saveMenuMode='menu'; // 'menu'：欢迎界面进入，仅读取/删除；'game'：游戏中进入，额外可保存
function renderSaveSlot(slot,label){
  const d=readSave(slot);
  const wrap=document.createElement('div');
  wrap.className='save-slot';
  const meta=document.createElement('div');
  meta.className='meta';
  if (!d){
    const b=document.createElement('b'); b.textContent=label;
    meta.appendChild(b); meta.appendChild(document.createTextNode(' · 空'));
  } else {
    const bless=d.warrior?'战士':d.angel?'天使':d.hero?'勇者':d.hermit?'隐者':'-';
    const time=new Date(d.savedAt).toLocaleString();
    const b=document.createElement('b'); b.textContent=label;
    meta.appendChild(b);
    meta.appendChild(document.createTextNode(` · 第 ${d.WAR} 回合 · ${bless} · ATK ${d.ATK} · HP ${d.HP} · ${time}`));
  }
  wrap.appendChild(meta);
  const ops=document.createElement('div');
  ops.className='ops';
  if (saveMenuMode==='game' && slot!=='auto' && roundStartSnap){
    const b=document.createElement('button');
    b.className='choice-btn'; b.textContent='保存';
    b.onclick=async ()=>{
      if (d && !(await pixelConfirm('该槽位已有存档，保存将覆盖，确定？'))) return;
      writeSave(slot,roundStartSnap); renderSaveList();
    };
    ops.appendChild(b);
  }
  if (d){
    const bl=document.createElement('button');
    bl.className='choice-btn'; bl.textContent='读取';
    bl.onclick=async ()=>{ if (await pixelConfirm('载入存档将覆盖当前进度，确定？')) loadSlot(slot); };
    ops.appendChild(bl);
    const bd=document.createElement('button');
    bd.className='choice-btn danger'; bd.textContent='删除';
    bd.onclick=async ()=>{ if (await pixelConfirm('确定删除该存档？')){ deleteSave(slot); renderSaveList(); } };
    ops.appendChild(bd);
  }
  wrap.appendChild(ops);
  return wrap;
}

  autoStick=true; scrollLatestBtn.hidden=true;
  applySnapshot(d);
  gameActive=true;
  updateHUD();
  await L(`已载入存档（第 ${d.WAR} 回合）。`,0);
  if (aborted(ep)) return;
  if (G.WAR>=20) return bossNode(ep);
  return mainRounds(ep);
}
function showChangelog(){
  const v5=document.getElementById('changelogV5');
  const web=document.getElementById('changelogWeb');
  const play=document.getElementById('changelogPlay');
  v5.innerHTML=CHANGELOG_V5.map(t=>`<li>${t}</li>`).join('');
  web.innerHTML=CHANGELOG_WEB.map(t=>`<li>${t}</li>`).join('');
  play.innerHTML=CHANGELOG_PLAY.map(t=>`<li>${t}</li>`).join('');
  hideAllOverlays();
  changelogOverlay.hidden=false;
}

/* ---------- 覆盖层事件绑定 ---------- */
/* overlayReturnTo：记录进入存档面板前的来源，关闭时回到该来源而不是硬编码二选一 */
let overlayReturnTo=null;
function closeOverlayTo(target){
  hideAllOverlays();
  if (target==='settings'){ showSettings(); return; }
  if (!gameActive) welcomeOverlay.hidden=false;
}
document.getElementById('btnNewGame').onclick=()=>{ startNewGame(); };
document.getElementById('btnContinue').onclick=()=>{ if (!document.getElementById('btnContinue').disabled) loadSlot('auto'); };
document.getElementById('btnSaveMenu').onclick=()=>{ overlayReturnTo=null; showSaveMenu('menu'); };
document.getElementById('btnSettingsMenu').onclick=()=>showSettings();
document.getElementById('btnChangelog').onclick=()=>showChangelog();
document.getElementById('btnSaveClose').onclick=()=>closeOverlayTo(overlayReturnTo);
document.getElementById('btnChangelogClose').onclick=()=>{ hideAllOverlays(); if (!gameActive) welcomeOverlay.hidden=false; };
document.getElementById('settingsBtn').onclick=()=>showSettings();
document.getElementById('btnSettingsClose').onclick=()=>{ hideAllOverlays(); if (!gameActive) welcomeOverlay.hidden=false; };
document.getElementById('btnSettingsSave').onclick=()=>{ overlayReturnTo='settings'; showSaveMenu('game'); };
document.getElementById('btnReplayTutorial').onclick=()=>replayTutorial().catch(err=>console.error(err));
document.getElementById('btnReturnTitle').onclick=async ()=>{
  if (!(await pixelConfirm('返回标题将暂停当前进度（自动存档已保留），确定？'))) return;
  runEpoch++;
  fastForward=null;
  gameActive=false;
  resetState();
  termEl.innerHTML='';
  choicesEl.innerHTML='';
  hideEnemyCard();
  prevHUD={ATK:null,ZDYHP:null,BJ:null,BS:null,CRT:null};
  autoStick=true; scrollLatestBtn.hidden=true;
  updateHUD();
  showWelcome();
};
document.querySelectorAll('input[name="speedOpt"]').forEach(r=>{
  r.addEventListener('change',()=>{
    if (!r.checked) return;
    /* 玩家在设置面板明确选择速度即视为显式表态，标题界面与游戏中都落盘 */
    G.fast=(r.value==='fast');
    saveSpeedPref(r.value);
  });
});

/* ---------- 启动 / 重开 ---------- */
function startNewGame(){
  runEpoch++;
  const ep=runEpoch;
  fastForward=null;
  hideAllOverlays();
  resetState();
  deleteSave('auto');
  termEl.innerHTML='';
  choicesEl.innerHTML='';
  hideEnemyCard();
  prevHUD={ATK:null,ZDYHP:null,BJ:null,BS:null,CRT:null};
  autoStick=true; scrollLatestBtn.hidden=true;
  gameActive=true;
  const sp=loadSpeedPref();
  if (sp) applySpeed(sp);
  updateHUD();
  introAndPlay(ep).catch(e=>{ console.error(e); L('发生了意外错误，请重新开始。',0,'bad'); });
}
function initApp(){
  cleanupLegacySaves();
  resetState();
  updateHUD();
  const sp=loadSpeedPref();
  G.fast=(sp==='fast');
  const speedRadio=document.querySelector(`input[name="speedOpt"][value="${sp==='fast'?'fast':'normal'}"]`);
  if (speedRadio) speedRadio.checked=true;
  try{
    skipAnim = localStorage.getItem(prefKey('skipAnim'))==='1';
    document.getElementById('skipAnimToggle').checked=skipAnim;
    const crtOn = localStorage.getItem(prefKey('crt'))!=='0';
    document.getElementById('crtToggle').checked=crtOn;
    document.getElementById('app').classList.toggle('crt-on',crtOn);
  }catch(err){}
  showWelcome();
}
initApp();
</script>
